name: novacart-production-like

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  deploy:
    resources:
      limits: {cpus: "1.00", memory: 1G}

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets: [postgres_admin_password]
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    deploy: {resources: {limits: {cpus: "1.00", memory: 1G}}}

  redis:
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    networks: [data]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy: {resources: {limits: {cpus: "0.50", memory: 512M}}}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: {context: ./backend}
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOVACART_POSTGRES_USER: ${POSTGRES_USER}
      NOVACART_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      NOVACART_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [postgres_admin_password, postgres_runtime_password, redis_password]
    command: ["sh", "-c", "alembic upgrade head && python -m app.prepare_database && PGPASSWORD=$$(cat /run/secrets/postgres_admin_password) psql -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB -v runtime_user=$$NOVACART_RUNTIME_DB_USER -v runtime_password=$$(cat /run/secrets/postgres_runtime_password) -v database_name=$$POSTGRES_DB -f /app/deploy/grant-runtime.sql"]
    volumes: ["./deploy:/app/deploy:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  api:
    <<: *hardened
    ports: !reset []
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOVACART_POSTGRES_USER: ${NOVACART_RUNTIME_DB_USER:-novacart_runtime}
      NOVACART_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      NOVACART_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [postgres_runtime_password, redis_password]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "proxy"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [data, services]

  worker:
    <<: *hardened
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      NOVACART_POSTGRES_USER: ${NOVACART_RUNTIME_DB_USER:-novacart_runtime}
      NOVACART_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      NOVACART_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets: [postgres_runtime_password, redis_password]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [data, services]

  mock-commerce:
    <<: *hardened
    ports: !reset []
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    networks: [services]
    volumes: [mock_commerce_data:/data]
  mock-crm:
    <<: *hardened
    ports: !reset []
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    networks: [services]
    volumes: [mock_crm_data:/data]
  frontend:
    <<: *hardened
    ports: !reset []
    networks: [services]

  proxy:
    image: nginx:1.29.1-alpine3.22
    user: "101:101"
    depends_on: {api: {condition: service_healthy}, frontend: {condition: service_healthy}}
    ports: ["${HTTP_HOST_PORT:-8088}:8080", "${HTTPS_HOST_PORT:-8443}:8443"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    secrets: [tls_certificate, tls_private_key]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck: {test: [CMD, wget, --spider, -q, --no-check-certificate, https://127.0.0.1:8443/health/live], interval: 10s, timeout: 5s, retries: 10}
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    networks: [services]


networks:
  backend: {internal: true}
  edge: {internal: true}
  data: {internal: true}
  services: {}

secrets:
  postgres_admin_password: {file: ./secrets/postgres_admin_password.txt}
  postgres_runtime_password: {file: ./secrets/postgres_runtime_password.txt}
  redis_password: {file: ./secrets/redis_password.txt}
  tls_certificate: {file: ./secrets/tls.crt}
  tls_private_key: {file: ./secrets/tls.key}
