name: Security and supply chain

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: python -m pip install bandit==1.8.6 pip-audit==2.9.0
      - run: bandit -q -r backend/app mock-commerce/app mock-crm/app -ll
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r mock-commerce/requirements.txt
      - run: pip-audit -r mock-crm/requirements.txt
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-audit:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22.20.0", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - run: PRODUCTION_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.yaml -f compose.production.yaml config --quiet
      - run: docker build -t novacart-api:ci backend
      - run: docker build -t novacart-frontend:ci frontend
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: novacart-api:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: novacart-api:ci
          artifact-name: novacart-api.spdx.json
          output-file: /tmp/novacart-api.spdx.json
