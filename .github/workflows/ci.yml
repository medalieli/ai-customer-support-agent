name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17-bookworm
        env:
          POSTGRES_DB: novacart
          POSTGRES_USER: novacart
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novacart -d novacart"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NOVACART_APP_ENV: test
      NOVACART_POSTGRES_HOST: localhost
      NOVACART_POSTGRES_DB: novacart
      NOVACART_POSTGRES_USER: novacart
      NOVACART_POSTGRES_PASSWORD: ci-only-password
      NOVACART_DEMO_AUTH_ENABLED: "true"
      NOVACART_DEMO_STAFF_PASSWORD: synthetic-demo-password
      NOVACART_RUN_DB_TESTS: "1"
      NOVACART_MOCK_COMMERCE_INTERNAL_API_KEY: replace-with-a-long-internal-only-key
      NOVACART_MOCK_CRM_INTERNAL_API_KEY: replace-with-a-long-internal-only-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e ".[dev]"
      - name: Start isolated mock providers
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up --build --wait -d mock-commerce mock-crm
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: python -m app.seed
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app tests
      - run: python -m app.evaluation --provider deterministic
      - run: pytest
      - name: Stop isolated mock providers
        if: always()
        working-directory: .
        run: docker compose down --volumes --remove-orphans

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mock-commerce:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mock-commerce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mock-commerce/pyproject.toml
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app tests
      - run: pytest

  mock-crm:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mock-crm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mock-crm/pyproject.toml
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app tests
      - run: pytest

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build

  browser-acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium webkit
        working-directory: frontend
      - shell: pwsh
        run: ./scripts/run-e2e.ps1 -Suite ${{ matrix.viewport }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.viewport }}
          path: frontend/test-results
