[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "novacart-support-backend"
version = "0.1.0"
description = "NovaCart support platform foundation"
requires-python = ">=3.10,<3.14"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "arq==0.28.0",
  "asyncpg==0.30.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.52",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
omit = ["*/app/worker/*", "*/app/domain/models.py", "*/app/seed.py"]
